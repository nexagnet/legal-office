# Production trên một máy (Tencent Lighthouse 2 vCPU/2GB). Chạy bằng:
#   docker compose --env-file /opt/legal-office/.env -f /opt/legal-office/deploy/docker-compose.yml up -d
# Postgres chạy trên host (apt) và chỉ nghe 127.0.0.1, nên api/web dùng mạng host; ufw chặn cổng 3000/3001 từ ngoài.
# Caddy (host) là điểm vào duy nhất: https://<tên miền> -> 127.0.0.1:3000. Không đưa bí mật vào file này: mọi giá trị lấy từ .env.
services:
  api:
    image: ${IMAGE_REGISTRY:-ghcr.io/nexagnet}/legal-office-api:${TAG:?TAG is required}
    network_mode: host
    restart: unless-stopped
    mem_limit: 256m
    environment:
      NODE_ENV: production
      PORT: '3001'
      NODE_OPTIONS: --max-old-space-size=160
      AUTH_MODE: password
      TRUST_PROXY: '1'
      # API chạy bằng vai legal_app (không superuser); vai chủ DB chỉ dùng cho migration lúc khởi động.
      DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
      MIGRATE_DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      APP_DB_ROLE: ${APP_DB_ROLE:-legal_app}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
      FILE_STORE: ${FILE_STORE:-r2}
      FILE_STORE_DIR: ${FILE_STORE_DIR:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      # Hai lịch nền cần danh sách tenant, nếu không chỉ ghi log lỗi và không chạy. Mặc định dùng đúng TENANT_ID của văn phòng.
      REMINDERS_SCHEDULE: ${REMINDERS_SCHEDULE:-on}
      REMINDER_TENANT_IDS: ${REMINDER_TENANT_IDS:-${TENANT_ID:?TENANT_ID is required}}
      SCAN_PURGE_SCHEDULE: ${SCAN_PURGE_SCHEDULE:-on}
      SCAN_PURGE_TENANT_IDS: ${SCAN_PURGE_TENANT_IDS:-${TENANT_ID:?TENANT_ID is required}}
      MAIL_SETTINGS_KEY: ${MAIL_SETTINGS_KEY:-}
      RATE_LIMIT_READ_PER_MIN: ${RATE_LIMIT_READ_PER_MIN:-3000}
      RATE_LIMIT_WRITE_PER_MIN: ${RATE_LIMIT_WRITE_PER_MIN:-600}
      RATE_LIMIT_AUTH_PER_MIN: ${RATE_LIMIT_AUTH_PER_MIN:-20}
      # Tài liệu cũ khách tự tải bằng giao diện: OCR liên tục do service ocr bên dưới, tìm kiếm bật ở đây. Đặt 0 trong .env để tắt.
      LEGACY_OCR_ENABLED: ${LEGACY_OCR_ENABLED:-1}
      LEGACY_SEARCH_ENABLED: ${LEGACY_SEARCH_ENABLED:-1}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  # OCR nền liên tục (hồ sơ mới trước, tài liệu cũ sau), mỗi lần đúng 1 tệp, 1 trang/lúc. Chung máy 2GB với api/web nên:
  # trần RAM/CPU cứng, ưu tiên CPU thấp, bị kill đầu tiên khi máy thiếu RAM, tự nghỉ khi RAM trống dưới OCR_MIN_FREE_MB.
  # Tệp bị kill/hết giờ chỉ ghi lỗi và thử lại tối đa 3 lần; không ảnh hưởng api/web (restart riêng).
  ocr:
    image: ${IMAGE_REGISTRY:-ghcr.io/nexagnet}/legal-office-ocr:${TAG:?TAG is required}
    network_mode: host
    restart: unless-stopped
    mem_limit: 600m
    memswap_limit: 600m
    cpus: 1.0
    cpu_shares: 128
    oom_score_adj: 800
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
      FILE_STORE: ${FILE_STORE:-r2}
      FILE_STORE_DIR: ${FILE_STORE_DIR:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      OCR_TENANT_IDS: ${OCR_TENANT_IDS:-${TENANT_ID:?TENANT_ID is required}}
      LEGACY_OCR_ENABLED: ${LEGACY_OCR_ENABLED:-1}
      OCR_MIN_FREE_MB: ${OCR_MIN_FREE_MB:-250}
      OCR_PDF_DPI: ${OCR_PDF_DPI:-200}
      OCR_PAGE_TIMEOUT_SECONDS: ${OCR_PAGE_TIMEOUT_SECONDS:-240}
      OCR_POLL_SECONDS: ${OCR_POLL_SECONDS:-30}
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/nexagnet}/legal-office-web:${TAG:?TAG is required}
    network_mode: host
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 127.0.0.1
      NODE_OPTIONS: --max-old-space-size=224
      API_URL: http://127.0.0.1:3001
      TENANT_ID: ${TENANT_ID:?TENANT_ID is required}
      TENANT_NAME: ${TENANT_NAME:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
