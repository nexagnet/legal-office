name: deploy

# CD của Legal Office: triển khai THỦ CÔNG, không tự chạy khi push. Mô tả đầy đủ ở docs/engineering/cd-quy-trinh.md.
#
#   Bấm "Run workflow" trên nhánh main, chọn môi trường:
#   - dev        : máy thử (hiện là server Tencent 2GB). Không cần ai duyệt.
#   - production : máy thật của khách. Environment `production` bắt buộc người duyệt, chỉ nhận nhánh main.
#
# Thứ tự: kiểm `ci` xanh đúng commit -> build 3 image, đẩy GHCR -> SSH vào server chạy deploy.sh (tự quay lại bản cũ nếu /health lỗi).
# Bí mật DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS: đặt ở Environment tương ứng (ưu tiên) hoặc ở repo (dùng chung).
# Dev trên Northflank vẫn tự deploy từ main ngoài GitHub, không đi qua workflow này.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Môi trường cần triển khai"
        type: choice
        options: [dev, production]
        default: dev
        required: true

permissions:
  contents: read
  packages: write
  checks: read

concurrency:
  group: legal-office-deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  # Bước 1: chỉ cho đi tiếp khi các check bắt buộc của `ci` đã xanh trên đúng commit sắp deploy.
  # (e2e-smoke không bắt buộc vì đôi khi chập chờn, xem docs/handover/06-viec-dang-do.md.)
  verify-ci:
    name: kiem-tra-ci-xanh
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Yêu cầu các check bắt buộc đã thành công trên ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          required="bootstrap-verify bootstrap-safety app-verify audit db-integration"
          runs="$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq '.check_runs[] | "\(.name) \(.conclusion)"')"
          echo "$runs"
          fail=0
          for name in $required; do
            if ! echo "$runs" | grep -qx "$name success"; then
              echo "::error::Check '$name' chưa xanh trên $SHA. Đợi ci xong (hoặc sửa lỗi) rồi chạy lại."
              fail=1
            fi
          done
          exit $fail

  # Bước 2: build, đẩy GHCR, cập nhật server. Môi trường production dừng ở đây chờ người duyệt.
  deploy:
    name: build-push-deploy (${{ inputs.target }})
    needs: verify-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.target }}
    env:
      IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      TAG: ${{ github.sha }}
    steps:
      - name: Checkout without persisted token
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build api image
        run: docker build --target api -t "$IMAGE_REGISTRY/legal-office-api:$TAG" .
      - name: Build ocr image
        run: docker build --target ocr -t "$IMAGE_REGISTRY/legal-office-ocr:$TAG" .
      - name: Build web image (API_URL is baked into Next rewrites at build time)
        run: docker build --target web --build-arg API_URL=http://127.0.0.1:3001 -t "$IMAGE_REGISTRY/legal-office-web:$TAG" .
      - name: Push images
        run: |
          docker push "$IMAGE_REGISTRY/legal-office-api:$TAG"
          docker push "$IMAGE_REGISTRY/legal-office-web:$TAG"
          docker push "$IMAGE_REGISTRY/legal-office-ocr:$TAG"
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy deploy files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          tar -C deploy -cf - . | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'mkdir -p /opt/legal-office/deploy && tar -C /opt/legal-office/deploy -xf - && chmod +x /opt/legal-office/deploy/scripts/*.sh'
      - name: Pull and restart on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # Token tạm của job được dùng để pull rồi đăng xuất, không lưu lại trên server.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null && (IMAGE_REGISTRY='$IMAGE_REGISTRY' /opt/legal-office/deploy/scripts/deploy.sh '$TAG'; rc=\$?; docker logout ghcr.io >/dev/null 2>&1; exit \$rc)"
      - name: Tóm tắt lần chạy
        if: always()
        run: |
          {
            echo "## Deploy ${{ inputs.target }}"
            echo "- Môi trường: **${{ inputs.target }}**"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Image: \`$IMAGE_REGISTRY/legal-office-{api,web,ocr}:$TAG\`"
            echo "- Người bấm: ${{ github.actor }}"
            echo "- Kết quả bước cuối: ${{ job.status }}"
            echo "- Quay lại bản cũ: SSH vào server, chạy \`/opt/legal-office/deploy/scripts/deploy.sh \$(cat /opt/legal-office/.previous-tag)\`"
          } >> "$GITHUB_STEP_SUMMARY"
