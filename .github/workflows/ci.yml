name: ci

# R3 source. Exact-head CI for application code (#37). Not deployment or preview-runtime proof.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: legal-office-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-verify:
    name: bootstrap-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # PR: immutable PR HEAD (not GitHub's synthetic merge commit). push: pushed commit.
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout without persisted token
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Assert checkout is the exact expected commit
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA} actual=${actual}"
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Checked-out HEAD ${actual} != expected ${EXPECTED_SHA}"
            exit 1
          fi
      - name: Validate bootstrap contract and tracked files
        run: node --test tests/bootstrap-contract.test.mjs

  bootstrap-safety:
    name: bootstrap-safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # PR: immutable PR HEAD (not GitHub's synthetic merge commit). push: pushed commit.
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout without persisted token
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Assert checkout is the exact expected commit
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA} actual=${actual}"
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Checked-out HEAD ${actual} != expected ${EXPECTED_SHA}"
            exit 1
          fi
      - name: Verify tracked file restrictions
        run: node scripts/check-tracked-file-safety.mjs

  app-verify:
    name: app-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # PR: immutable PR HEAD (not GitHub's synthetic merge commit). push: pushed commit.
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout without persisted token
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Assert checkout is the exact expected commit
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA} actual=${actual}"
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Checked-out HEAD ${actual} != expected ${EXPECTED_SHA}"
            exit 1
          fi
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm pinned by packageManager
        run: corepack enable
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm -r run lint
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Unit tests
        run: pnpm -r run test
      - name: Build
        run: pnpm -r run build
      - name: Format check
        run: pnpm run format:check

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # PR: immutable PR HEAD (not GitHub's synthetic merge commit). push: pushed commit.
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout without persisted token
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Assert checkout is the exact expected commit
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA} actual=${actual}"
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Checked-out HEAD ${actual} != expected ${EXPECTED_SHA}"
            exit 1
          fi
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm pinned by packageManager
        run: corepack enable
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies (high and above)
        run: pnpm audit --audit-level high

  db-integration:
    name: db-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # PR: immutable PR HEAD (not GitHub's synthetic merge commit). push: pushed commit.
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    services:
      postgres:
        image: postgres:17.6
        env:
          # Throwaway container reachable only from this job; no real data or credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout without persisted token
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Assert checkout is the exact expected commit
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA} actual=${actual}"
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Checked-out HEAD ${actual} != expected ${EXPECTED_SHA}"
            exit 1
          fi
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm pinned by packageManager
        run: corepack enable
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: pnpm -r --if-present run test:integration

  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # PR: immutable PR HEAD (not GitHub's synthetic merge commit). push: pushed commit.
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    services:
      postgres:
        image: postgres:17.6
        env:
          # Throwaway container reachable only from this job; no real data or credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout without persisted token
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Assert checkout is the exact expected commit
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA} actual=${actual}"
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Checked-out HEAD ${actual} != expected ${EXPECTED_SHA}"
            exit 1
          fi
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm pinned by packageManager
        run: corepack enable
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Build API and web
        # Do not set API_URL: the web build rewrites /api/* to the default http://localhost:3001, where the stack runs the API.
        run: pnpm --filter ./apps/api --filter ./apps/web run build
      - name: Install Chromium for Playwright
        run: pnpm --filter @legal-office/e2e exec playwright install --with-deps chromium
      - name: Start throwaway stack (temp database, fake office, API and web)
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: bash e2e/start-stack.sh
      - name: Browser smoke test
        run: pnpm --filter @legal-office/e2e run test:e2e
      - name: Show stack logs on failure
        if: failure()
        run: tail -n 60 e2e/.tmp/api.log e2e/.tmp/web.log || true
      - name: Stop stack
        if: always()
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: bash e2e/stop-stack.sh || true

# Proves lint/typecheck/test/build/audit, DB integration and a browser smoke (login to record) on the exact head. It does not prove
# deployment, preview runtime, or the Claude pipeline. Required-check ruleset changes are a separate R3 step.
