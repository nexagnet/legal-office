name: Nexagnet V5 Legal Office Read and MCP Diagnostics (branch only)

# R3 contract: https://github.com/nexagnet/legal-office/issues/175
# Review/evidence branch only: DO NOT MERGE this caller into main.
on:
  workflow_dispatch:
    inputs:
      expected_consumer_sha:
        description: Reviewed full consumer commit SHA
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  read:
    if: >-
      github.repository == 'nexagnet/legal-office' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'phungtienviet14-sketch' &&
      github.ref == 'refs/heads/codex/tool-isolation-runtime-36-37' &&
      github.sha == inputs.expected_consumer_sha
    uses: nexagnet/.github/.github/workflows/claude-read-isolation-probe.yml@cbbc92dc5f9892118b43fe408962f4e69cfae00d
    with:
      expected_consumer_sha: ${{ inputs.expected_consumer_sha }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  mcp:
    if: >-
      github.repository == 'nexagnet/legal-office' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'phungtienviet14-sketch' &&
      github.ref == 'refs/heads/codex/tool-isolation-runtime-36-37' &&
      github.sha == inputs.expected_consumer_sha
    uses: nexagnet/.github/.github/workflows/claude-mcp-isolation-probe.yml@cbbc92dc5f9892118b43fe408962f4e69cfae00d
    with:
      expected_consumer_sha: ${{ inputs.expected_consumer_sha }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
