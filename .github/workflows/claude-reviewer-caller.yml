name: Nexagnet V5 Legal Office Reviewer Caller

# R3 onboarding contract: https://github.com/nexagnet/legal-office/issues/2
# Chế độ PR thường của Reviewer dùng chung: tác giả tin cậy + ci xanh đúng HEAD +
# kiểm chỉ đọc + chặn đường dẫn nhạy cảm (.github, AGENTS.md, hạ tầng...).
# Không còn cần Task Contract. Đổi SHA ghim phải qua PR do chủ duyệt.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  # Reviewer gate/Claude jobs explicitly remain read-only in central workflow.
  # This caller ceiling only enables trusted Reporter PR-comment publication.
  pull-requests: write

jobs:
  reviewer:
    if: >-
      github.repository == 'nexagnet/legal-office' &&
      vars.AUTOPILOT_ENABLED != 'false' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number != null
    uses: nexagnet/.github/.github/workflows/claude-reviewer.yml@4ed9b70e1d7e0fb3b162e822f1be7c1a094ffd47
    with:
      pr_number: ${{ github.event.workflow_run.pull_requests[0].number }}
      expected_head_sha: ${{ github.event.workflow_run.head_sha }}
      ci_run_id: ${{ github.event.workflow_run.id }}
      required_jobs_csv: bootstrap-verify,bootstrap-safety,app-verify,audit,db-integration
      # Chế độ PR thường (không cần Task Contract/Issue/nhãn rủi ro). PR Draft bị bỏ qua êm.
      require_task_contract: false
      trusted_authors_csv: phungtienviet14-sketch
      max_changed_files: 100
      ignore_count_regex: '^pnpm-lock\.yaml$|^docs/|^apps/api/drizzle/meta/'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
