name: Nexagnet V5 Legal Office Reviewer Caller

# R3 onboarding contract: https://github.com/nexagnet/legal-office/issues/2
# Central Reviewer accepts only Publisher-bot PRs from approved R0/R1/R2
# Task Contracts, exact PR HEAD CI and non-control-plane changes.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: read
  issues: write
  pull-requests: read

jobs:
  reviewer:
    if: >-
      github.repository == 'nexagnet/legal-office' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number != null
    uses: nexagnet/.github/.github/workflows/claude-reviewer.yml@f165e9adf8c727e4b6e87981bacc36f1933110ad
    with:
      pr_number: ${{ github.event.workflow_run.pull_requests[0].number }}
      expected_head_sha: ${{ github.event.workflow_run.head_sha }}
      ci_run_id: ${{ github.event.workflow_run.id }}
      required_jobs_csv: bootstrap-verify,bootstrap-safety
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
