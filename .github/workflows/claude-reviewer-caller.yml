name: Nexagnet V5 Legal Office Reviewer Caller

# R3 onboarding contract: https://github.com/nexagnet/legal-office/issues/2
# Central Reviewer verifies Publisher PRs or explicitly owner-signed
# Claude Project PRs, always with exact-head CI, canonical Task Contract and
# strict protected-path controls; unsigned owner PRs fail closed.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  # Reviewer gate/Claude jobs explicitly remain read-only in central workflow.
  # This caller ceiling only enables trusted Reporter PR-comment publication.
  pull-requests: write

jobs:
  reviewer:
    if: >-
      github.repository == 'nexagnet/legal-office' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number != null
    uses: nexagnet/.github/.github/workflows/claude-reviewer.yml@7166e745607860e6f8a414548963f83d12c71f9b
    with:
      pr_number: ${{ github.event.workflow_run.pull_requests[0].number }}
      expected_head_sha: ${{ github.event.workflow_run.head_sha }}
      ci_run_id: ${{ github.event.workflow_run.id }}
      required_jobs_csv: bootstrap-verify,bootstrap-safety,app-verify,audit,db-integration
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
