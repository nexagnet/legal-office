name: Nexagnet V5 Legal Office Builder Caller

# R3 onboarding contract: https://github.com/nexagnet/legal-office/issues/2
# Event belongs to this consumer repository. No org-wide event listener.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  builder:
    # Issue-only, owner-authored comments. Central preflight re-fetches the
    # live Issue/Task Contract, exactly one R0/R1/R2 risk and autopilot:ready.
    if: >-
      github.repository == 'nexagnet/legal-office' &&
      github.actor == 'phungtienviet14-sketch' &&
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@claude')
    uses: nexagnet/.github/.github/workflows/claude-builder.yml@0d253050b996ce7bf5a08a3728f3b1dc97445656
    with:
      issue_number: ${{ github.event.issue.number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      BUILDER_PUBLISHER_APP_ID: ${{ secrets.BUILDER_PUBLISHER_APP_ID }}
      BUILDER_PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.BUILDER_PUBLISHER_APP_PRIVATE_KEY }}
