name: Nexagnet V5 Legal Office Builder Caller

# R3 rollout contract: https://github.com/nexagnet/legal-office/issues/493
# Event belongs to this consumer repository. No org-wide event listener.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  command-gate:
    if: >-
      github.repository == 'nexagnet/legal-office' &&
      vars.AUTOPILOT_ENABLED != 'false' &&
      github.actor == 'phungtienviet14-sketch' &&
      github.event.action == 'created' &&
      github.event.sender.login == 'phungtienviet14-sketch' &&
      github.event.comment.user.login == 'phungtienviet14-sketch' &&
      github.event.comment.user.type == 'User' &&
      github.event.issue.pull_request == null &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      accepted: ${{ steps.command.outputs.accepted }}
    steps:
      - name: Match the complete owner command
        id: command
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync, appendFileSync } = require('node:fs');
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const body = event?.comment?.body;
          const command = typeof body === 'string' ? body.replace(/[ \t\r\n]+$/, '') : '';
          const accepted = command === '@claude' || command === '@claude retry';
          appendFileSync(process.env.GITHUB_OUTPUT, `accepted=${accepted}\n`);
          NODE

  builder:
    # Central preflight independently verifies intent, live issue and risk.
    needs: command-gate
    if: needs.command-gate.outputs.accepted == 'true' && github.run_attempt == '1'
    uses: nexagnet/.github/.github/workflows/claude-builder.yml@907fd9287a9789bfe4db9428f91140efa6b87acc
    with:
      issue_number: ${{ github.event.issue.number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      BUILDER_PUBLISHER_APP_ID: ${{ secrets.BUILDER_PUBLISHER_APP_ID }}
      BUILDER_PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.BUILDER_PUBLISHER_APP_PRIVATE_KEY }}
